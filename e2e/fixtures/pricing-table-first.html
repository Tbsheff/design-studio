<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table-first pricing</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 40px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <main>
    <h1>Pricing</h1>
    <table>
      <thead><tr><th>Feature</th><th>Starter $19 / month</th><th>Team $49 / month</th><th>Scale $129 / month</th></tr></thead>
      <tbody><tr><td>Events</td><td>100k</td><td>1M</td><td>10M</td></tr></tbody>
    </table>
    <h2>FAQ</h2>
    <details><summary>What counts as an event?</summary><p>One tracked action.</p></details>
  </main>
</body>
</html>
